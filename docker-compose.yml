services:

  # ==========================================================
  # BASE DE DATOS POSTGRESQL
  # ==========================================================
  postgres:
    image: postgres:15-alpine
    container_name: cine-postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nodejs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ${DB_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nodejs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ==========================================================
  # MIGRACIONES DE BASE DE DATOS (TYPEORM)
  # ==========================================================
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-cine-backend-nest:latest}
    container_name: cine-backend-migrate
    command: npm run migration:run
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-nodejs}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=${DB_NAME:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ==========================================================
  # API BACKEND NESTJS (ESCALABLE DINÁMICAMENTE)
  # ==========================================================
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-cine-backend-nest:latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-nodejs}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=${DB_NAME:-postgres}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-riwi_super_access_secret_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-riwi_super_refresh_secret_2026}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - COOKIE_SECURE=false
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    deploy:
      replicas: ${API_REPLICAS:-2}
    networks:
      - backend
      - jenkins-network

  # ==========================================================
  # NGINX - PROXY REVERSO Y BALANCEADOR DE CARGA
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: cine-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - backend
      - jenkins-network

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
  jenkins-network:
    name: jenkins-network
    driver: bridge
