services:

  # ==========================================================
  # BASE DE DATOS POSTGRESQL
  # ==========================================================
  postgres:
    image: postgres:15-alpine
    container_name: cine-postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME:-nodejs}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-123456}
      - POSTGRES_DB=${DB_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nodejs} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  # ==========================================================
  # API BACKEND NESTJS
  # ==========================================================
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-cine-backend-nest:latest}
    container_name: cine-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-nodejs}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-riwi_super_access_secret_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-riwi_super_refresh_secret_2026}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-riwi.manulz.dev}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - jenkins-network

  # ==========================================================
  # FRONTEND (SPA / NEXTJS / REACT)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-cine-frontend:latest}
    container_name: cine-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    networks:
      - backend
      - jenkins-network

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
  jenkins-network:
    name: jenkins-network
    driver: bridge
