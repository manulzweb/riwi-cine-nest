services:

  # ==========================================================
  # BASE DE DATOS POSTGRESQL
  # ==========================================================
  postgres:
    image: postgres:15-alpine
    container_name: cine-postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ==========================================================
  # MIGRACIONES DE BASE DE DATOS (TYPEORM)
  # ==========================================================
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${APP_IMAGE}
    container_name: cine-backend-migrate
    command: npm run migration:run
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ==========================================================
  # API BACKEND NESTJS (ESCALABLE DINÁMICAMENTE)
  # ==========================================================
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SECURE=false
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    deploy:
      replicas: ${API_REPLICAS}
    networks:
      - backend
      - jenkins-network

  # ==========================================================
  # NGINX - PROXY REVERSO Y BALANCEADOR DE CARGA
  # ==========================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${NGINX_IMAGE}
    container_name: cine-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT}:80"
    networks:
      - backend
      - jenkins-network

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
  jenkins-network:
    name: jenkins-network
    driver: bridge
