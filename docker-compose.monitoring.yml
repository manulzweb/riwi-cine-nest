services:

  # ==========================================================
  # ZABBIX DATABASE (POSTGRESQL)
  # ==========================================================
  zabbix-db:
    image: postgres:15-alpine
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_pass_2026}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  # ==========================================================
  # ZABBIX SERVER (CORE DE MONITOREO)
  # ==========================================================
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_pass_2026}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
    depends_on:
      - zabbix-db
    networks:
      - monitoring-network
      - backend

  # ==========================================================
  # ZABBIX WEB INTERFACE (NGINX + PHP)
  # ==========================================================
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    ports:
      - "${ZABBIX_WEB_PORT:-8088}:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_pass_2026}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      PHP_TZ: America/Bogota
    depends_on:
      - zabbix-server
    networks:
      - monitoring-network

  # ==========================================================
  # ZABBIX AGENT 2 (RECOLECCIÓN DE MÉTRICAS DEL HOST Y DOCKER)
  # ==========================================================
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    ports:
      - "${ZABBIX_AGENT_PORT:-10050}:10050"
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: "zabbix-server,127.0.0.1"
      ZBX_SERVER_ACTIVE: "zabbix-server"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    networks:
      - monitoring-network

# ==========================================================
# NETWORKS
# ==========================================================
networks:
  monitoring-network:
    name: monitoring-network
    driver: bridge
  backend:
    external: true

# ==========================================================
# VOLUMES
# ==========================================================
volumes:
  zabbix_db_data:
